architectury {
    common(enabled_platforms.split(","))
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${architectury_api_version}"

    // The Fabric artifact is used only as the common compile classpath because it
    // exposes Cobblemon's shared API. Each loader module also declares its own jar.
    modImplementation "curse.maven:cobblemon-${cobblemon_curse_id}:${cobblemon_fabric_file}"
}
